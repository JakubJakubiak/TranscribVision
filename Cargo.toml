[package]
name = "transcribvision"
version = "0.3.0"
edition = "2024"
description = "Napisy do wideo: transkrypcja whisper.cpp, wycinanie pauz, animowane napisy z podświetlaniem słów. Czysty Rust."

[features]
default = ["metal"]
# GPU (Metal) dla whisper.cpp na Macu.
metal = ["whisper-rs/metal"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui-wgpu = "0.37"
whisper-rs = "0.16"
craft-video = { git = "https://github.com/storytold/craft-libs", rev = "156b491b91f3693f4fce53bf69bb97791f51198f", features = ["h264-decode", "h264-encode", "hevc-decode", "threads"] }
craft-media = { git = "https://github.com/storytold/craft-libs", rev = "156b491b91f3693f4fce53bf69bb97791f51198f", default-features = false, features = ["isobmff"] }
craft-audio = { git = "https://github.com/storytold/craft-libs", rev = "156b491b91f3693f4fce53bf69bb97791f51198f", default-features = false, features = ["aac-decode", "aac-encode", "decode-native", "rayon"] }
ab_glyph = "0.2"
cpal = "0.18"
rfd = "0.18"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rustfft = "6"
rayon = "1"
bytemuck = { version = "1", features = ["derive"] }
dirs = "7"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
debug = false
